[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-analyze"
version = "0.1.0"
description = "Player position analysis for fixed-camera singles tennis video"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "torch",
    "torchvision",
    "matplotlib",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tennis-analyze = "tennis_analyze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tennis_analyze = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
